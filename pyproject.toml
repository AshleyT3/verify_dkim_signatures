[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "verify-dkim-signatures"
version = "1.1.0"
description = "Verify DKIM and ARC signatures on .eml files, with an offline key cache and failure-cause classification."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["dkim", "arc", "email", "authentication", "eml"]
dependencies = [
  "dkimpy>=1.0.5",
  "dnspython>=2.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "cryptography>=3.4",
  "ruff>=0.6",
]

[project.scripts]
verify-dkim = "verify_dkim_signatures:main"

[tool.setuptools]
py-modules = ["verify_dkim_signatures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# The tree predates a linter and has its own formatting; keep the gate to
# genuine defects (syntax errors, undefined names, unused imports) rather than
# reflowing the module.
select = ["E9", "F"]
